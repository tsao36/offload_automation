<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Loading Dashboard</title>
  <style>
    :root { color-scheme: light; --ink:#151C27; --muted:#44555F; --surface:#FAF9F3; --line:#7686A3; --accent:#BC704A; --gold:#BC704A; --blue:#44555F; --deep:#151C27; --danger:#BC704A; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink); background:linear-gradient(145deg,#151C27 0%,#44555F 52%,#7686A3 100%); font-family:"Segoe UI",Tahoma,sans-serif;
    }
    main { width:min(1180px,calc(100% - 32px)); margin:32px auto; }
    .masthead { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:20px; color:#FAF9F3; }
    h1 { margin:0; color:#FAF9F3; font-size:clamp(28px,4vw,46px); letter-spacing:0; text-shadow:0 1px 2px rgba(21,28,39,.45); }
    .subtitle { margin:8px 0 0; color:#7686A3; }
    .refresh { padding:11px 16px; border:1px solid var(--accent); border-radius:6px; color:#FAF9F3; background:var(--accent); font:700 14px "Segoe UI",Tahoma,sans-serif; cursor:pointer; }
    .refresh:hover,.refresh:focus-visible { background:#44555F; outline:3px solid rgba(250,249,243,.35); }
    .actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
    .run-batch { padding:11px 16px; border:1px solid #FAF9F3; border-radius:6px; color:#FAF9F3; background:transparent; font:700 14px "Segoe UI",Tahoma,sans-serif; cursor:pointer; }
    .run-batch:hover,.run-batch:focus-visible { color:var(--ink); background:#FAF9F3; outline:3px solid rgba(250,249,243,.35); }
    .run-batch:disabled { cursor:wait; opacity:.65; }
    #run-status { color:#FAF9F3; font:12px "Segoe UI",Tahoma,sans-serif; }
    .summary { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
    .stat { min-width:160px; padding:14px 16px; background:rgba(250,249,243,.96); border-left:5px solid var(--gold); border-radius:6px; box-shadow:0 4px 14px rgba(21,28,39,.18); }
    .stat span { display:block; color:var(--muted); font:12px "Segoe UI",Tahoma,sans-serif; text-transform:uppercase; letter-spacing:.08em; }
    .stat strong { display:block; margin-top:4px; font-size:24px; }
    .panel { overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 18px 40px rgba(21,28,39,.22); }
    .panel-head { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:22px; }
    #status { color:var(--muted); font:13px "Segoe UI",Tahoma,sans-serif; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; font:14px "Segoe UI",Tahoma,sans-serif; }
    th { padding:12px 14px; color:#fff; background:var(--deep); text-align:left; white-space:nowrap; }
    td { padding:12px 14px; border-bottom:1px solid #f0dfb8; }
    tr:nth-child(even) td { background:#f4f8fc; }
    td:not(:first-child), th:not(:first-child) { text-align:right; }
    .weighted { color:var(--accent); font-weight:800; }
    .empty { padding:38px 22px; color:var(--muted); text-align:center; font-family:"Segoe UI",Tahoma,sans-serif; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; padding:14px 20px; background:#FAF9F3; border-bottom:1px solid var(--line); }
    .toolbar label { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; font-weight:700; }
    .toolbar input,.toolbar select { min-height:36px; padding:7px 9px; border:1px solid #7686A3; border-radius:5px; color:var(--ink); background:#fff; font:14px "Segoe UI",Tahoma,sans-serif; }
    .toolbar input:focus-visible,.toolbar select:focus-visible { outline:3px solid rgba(188,112,74,.3); border-color:var(--accent); }
    .footnote { margin:14px 0 0; color:var(--muted); font:12px "Segoe UI",Tahoma,sans-serif; }
    .error { color:var(--danger) !important; font-weight:700; }
    @media (max-width:650px) { main { width:calc(100% - 20px); margin:18px auto; } .masthead { display:block; } .refresh { margin-top:16px; } }
  </style>
</head>
<body>
  <main>
    <header class="masthead"><div><h1>Team Loading Dashboard</h1><p class="subtitle">Weighted loading from the latest daily offload summary</p></div><div class="actions"><span id="run-status">Ready</span><button class="run-batch" type="button" id="run-batch">Run daily loading</button><button class="refresh" type="button" id="refresh">Refresh loading</button></div></header>
    <section class="summary" aria-label="Loading summary"><div class="stat"><span>Team members</span><strong id="member-count">-</strong></div><div class="stat"><span>Total weighted loading</span><strong id="weighted-total">-</strong></div><div class="stat"><span>Updated</span><strong id="updated">-</strong></div></section>
    <section class="panel"><div class="panel-head"><h2>Weighted team loading</h2><span id="status">Loading...</span></div><div class="toolbar"><label>Date <select id="date-filter"><option value="latest">Latest</option></select></label><label>Search <input id="name-filter" type="search" placeholder="Member name" aria-label="Search member name"></label><label>Category <select id="category-filter"><option value="">All categories</option></select></label><label>Sort <select id="sort-filter"><option value="weighted_loading_value">Weighted loading</option><option value="total">Total issues</option><option value="name">Name</option></select></label></div><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="empty" id="empty" hidden></div></section>
    <p class="footnote">Weighted Loading uses active IPS, Jira, and active HSD only. Active HSD = uHSD - Stale HSD.</p>
  </main>
  <script>
    const money = value => Number(value || 0).toFixed(2);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    let currentSnapshot = { rows: [], categories: [] };
    function renderSnapshot() {
      const rows = currentSnapshot.rows.filter(row => {
        const nameMatch = String(row.name || '').toLowerCase().includes(document.querySelector('#name-filter').value.toLowerCase());
        const category = document.querySelector('#category-filter').value;
        return nameMatch && (!category || Number(row.category_counts?.[category] || 0) > 0);
      }).sort((left, right) => {
        const key = document.querySelector('#sort-filter').value;
        return key === 'name' ? String(left.name).localeCompare(String(right.name)) : Number(right[key] || 0) - Number(left[key] || 0);
      });
      document.querySelector('#member-count').textContent = rows.length; document.querySelector('#weighted-total').textContent = money(rows.reduce((sum, row) => sum + Number(row.weighted_loading_value || 0), 0));
      document.querySelector('#table-head').innerHTML = `<tr><th>Name</th><th>uIPS</th><th>Active IPS</th><th>uHSD</th><th>Active HSD</th><th>Jira</th><th>Stale IPS</th><th>Stale HSD</th><th>Total</th><th>Weighted Loading</th>${currentSnapshot.categories.map(category => `<th>Active ${esc(category)}</th>`).join('')}</tr>`;
      document.querySelector('#table-body').innerHTML = rows.map(row => { const activeUips = row.active_uips ?? Math.max(0, Number(row.uips || 0) - Number(row.stale_ips || 0) - Number(row.close_pending || 0)); const activeHsd = row.active_hsd ?? Math.max(0, Number(row.uhsd || 0) - Number(row.stale_hsd || 0)); return `<tr><td>${esc(row.name)}</td><td>${row.uips ?? 0}</td><td>${activeUips}</td><td>${row.uhsd ?? 0}</td><td>${activeHsd}</td><td>${row.jira ?? 0}</td><td>${row.stale_ips ?? 0}</td><td>${row.stale_hsd ?? 0}</td><td>${row.total ?? 0}</td><td class="weighted">${esc(row.weighted_loading || '')}</td>${currentSnapshot.categories.map(category => `<td>${row.category_counts?.[category] ?? 0}</td>`).join('')}</tr>`; }).join('');
      const empty = document.querySelector('#empty'); empty.hidden = rows.length > 0; empty.textContent = currentSnapshot.rows.length ? 'No members match the current filters. Clear a filter to see more results.' : (currentSnapshot.message || 'No loading rows are available.');
    }
    async function loadDates() {
      const response = await fetch('/api/dates', { cache: 'no-store' }); if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const dates = await response.json(); const select = document.querySelector('#date-filter'); const selectedDate = select.value; select.innerHTML = '<option value="latest">Latest</option>';
      dates.dates.forEach(date => { const option = document.createElement('option'); option.value = date; option.textContent = date; select.appendChild(option); });
      select.value = dates.dates.includes(selectedDate) ? selectedDate : 'latest';
    }
    async function loadSnapshot() {
      const status = document.querySelector('#status'); const empty = document.querySelector('#empty'); status.textContent = 'Loading...';
      try {
        await loadDates(); const date = document.querySelector('#date-filter').value; const response = await fetch(`/api/loading?date=${encodeURIComponent(date)}`, { cache: 'no-store' }); if (!response.ok) throw new Error(`HTTP ${response.status}`);
        currentSnapshot = await response.json(); currentSnapshot.rows = Array.isArray(currentSnapshot.rows) ? currentSnapshot.rows : []; currentSnapshot.categories = Array.isArray(currentSnapshot.categories) ? currentSnapshot.categories : [];
        document.querySelector('#updated').textContent = currentSnapshot.generated_at ? new Date(currentSnapshot.generated_at).toLocaleString() : '-';
        const categorySelect = document.querySelector('#category-filter'); const selectedCategory = categorySelect.value; categorySelect.innerHTML = '<option value="">All categories</option>'; currentSnapshot.categories.forEach(category => { const option = document.createElement('option'); option.value = category; option.textContent = category; categorySelect.appendChild(option); }); categorySelect.value = currentSnapshot.categories.includes(selectedCategory) ? selectedCategory : '';
        renderSnapshot(); status.textContent = currentSnapshot.available ? (date === 'latest' ? 'Latest snapshot' : `Snapshot ${date}`) : 'Waiting for batch result'; status.classList.remove('error');
      } catch (error) { status.textContent = 'Unavailable'; status.classList.add('error'); empty.hidden = false; empty.textContent = `Unable to load team loading: ${error.message}`; }
    }
    const runButton = document.querySelector('#run-batch');
    const runStatus = document.querySelector('#run-status');
    async function readBatchStatus() {
      const response = await fetch('/api/batch', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function runBatch() {
      runButton.disabled = true; runStatus.textContent = 'Starting batch...';
      try {
        const response = await fetch('/api/run-batch', { method: 'POST' });
        const result = await response.json();
        if (!response.ok && response.status !== 409) throw new Error(result.message || `HTTP ${response.status}`);
        runStatus.textContent = 'Batch running...';
        const poll = async () => {
          const state = await readBatchStatus();
          if (state.running) { runStatus.textContent = 'Batch running...'; window.setTimeout(poll, 2000); return; }
          runButton.disabled = false;
          if (state.return_code === 0) { runStatus.textContent = 'Batch complete'; await loadSnapshot(); }
          else { runStatus.textContent = `Batch ended with code ${state.return_code ?? 'unknown'}`; }
        };
        await poll();
      } catch (error) { runButton.disabled = false; runStatus.textContent = `Unable to run batch: ${error.message}`; }
    }
    document.querySelector('#refresh').addEventListener('click', loadSnapshot);
    document.querySelector('#date-filter').addEventListener('change', loadSnapshot);
    document.querySelector('#name-filter').addEventListener('input', renderSnapshot);
    document.querySelector('#category-filter').addEventListener('change', renderSnapshot);
    document.querySelector('#sort-filter').addEventListener('change', renderSnapshot);
    runButton.addEventListener('click', runBatch);
    loadSnapshot();
  </script>
</body>
</html>
