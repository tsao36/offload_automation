<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Loading</title>
  <style>
    :root { color-scheme: light; --ink:#342924; --muted:#7c4636; --surface:#fffaf0; --line:#e6c98d; --accent:#7c4636; --gold:#f9d689; --brown:#bd8a5a; --deep:#373743; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink); background: linear-gradient(145deg,#373743 0%,#342924 52%,#7c4636 100%); font-family: Georgia,"Times New Roman",serif;
    }
    main { width:min(1180px,calc(100% - 32px)); margin:32px auto; }
    .masthead { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:20px; color:#fffaf0; }
    h1 { margin:0; font-size:clamp(28px,4vw,46px); letter-spacing:.02em; }
    .subtitle { margin:8px 0 0; color:#f9d689; font-family:"Segoe UI",Tahoma,sans-serif; }
    .refresh { padding:11px 16px; border:1px solid #f9d689; border-radius:6px; color:#342924; background:#f9d689; font:700 14px "Segoe UI",Tahoma,sans-serif; cursor:pointer; }
    .refresh:hover,.refresh:focus-visible { background:#fffaf0; outline:3px solid rgba(249,214,137,.35); }
    .actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end; }
    .run-batch { padding:11px 16px; border:1px solid #fffaf0; border-radius:6px; color:#fffaf0; background:transparent; font:700 14px "Segoe UI",Tahoma,sans-serif; cursor:pointer; }
    .run-batch:hover,.run-batch:focus-visible { color:#342924; background:#fffaf0; outline:3px solid rgba(249,214,137,.35); }
    .run-batch:disabled { cursor:wait; opacity:.65; }
    #run-status { color:#f9d689; font:12px "Segoe UI",Tahoma,sans-serif; }
    .summary { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
    .stat { min-width:160px; padding:14px 16px; background:rgba(255,250,240,.96); border-left:5px solid var(--gold); border-radius:6px; }
    .stat span { display:block; color:var(--muted); font:12px "Segoe UI",Tahoma,sans-serif; text-transform:uppercase; letter-spacing:.08em; }
    .stat strong { display:block; margin-top:4px; font-size:24px; }
    .panel { overflow:hidden; background:var(--surface); border:1px solid var(--brown); border-radius:8px; box-shadow:0 18px 40px rgba(0,0,0,.18); }
    .panel-head { display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 20px; border-bottom:1px solid var(--line); }
    .panel-head h2 { margin:0; font-size:22px; }
    #status { color:var(--muted); font:13px "Segoe UI",Tahoma,sans-serif; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; min-width:760px; border-collapse:collapse; font:14px "Segoe UI",Tahoma,sans-serif; }
    th { padding:12px 14px; color:#fffaf0; background:var(--deep); text-align:left; white-space:nowrap; }
    td { padding:12px 14px; border-bottom:1px solid #f0dfb8; }
    tr:nth-child(even) td { background:#fff4d9; }
    td:not(:first-child), th:not(:first-child) { text-align:right; }
    .weighted { color:var(--accent); font-weight:800; }
    .empty { padding:38px 22px; color:var(--muted); text-align:center; font-family:"Segoe UI",Tahoma,sans-serif; }
    .footnote { margin:14px 0 0; color:#f9d689; font:12px "Segoe UI",Tahoma,sans-serif; }
    @media (max-width:650px) { main { width:calc(100% - 20px); margin:18px auto; } .masthead { display:block; } .refresh { margin-top:16px; } }
  </style>
</head>
<body>
  <main>
    <header class="masthead"><div><h1>Team Loading</h1><p class="subtitle">Weighted loading from the latest daily offload summary</p></div><div class="actions"><span id="run-status">Ready</span><button class="run-batch" type="button" id="run-batch">Run daily loading</button><button class="refresh" type="button" id="refresh">Refresh loading</button></div></header>
    <section class="summary" aria-label="Loading summary"><div class="stat"><span>Team members</span><strong id="member-count">-</strong></div><div class="stat"><span>Total weighted loading</span><strong id="weighted-total">-</strong></div><div class="stat"><span>Updated</span><strong id="updated">-</strong></div></section>
    <section class="panel"><div class="panel-head"><h2>Weighted team loading</h2><span id="status">Loading...</span></div><div class="table-wrap"><table><thead id="table-head"></thead><tbody id="table-body"></tbody></table></div><div class="empty" id="empty" hidden></div></section>
    <p class="footnote">Weighted Loading is calculated by the batch. Refresh reads the latest snapshot and does not rerun the batch.</p>
  </main>
  <script>
    const money = value => Number(value || 0).toFixed(2);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function loadSnapshot() {
      const status = document.querySelector('#status'); const empty = document.querySelector('#empty'); status.textContent = 'Loading...';
      try {
        const response = await fetch('/api/loading', { cache: 'no-store' }); if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const snapshot = await response.json(); const rows = Array.isArray(snapshot.rows) ? snapshot.rows : []; const categories = Array.isArray(snapshot.categories) ? snapshot.categories : [];
        document.querySelector('#member-count').textContent = rows.length; document.querySelector('#weighted-total').textContent = money(rows.reduce((sum, row) => sum + Number(row.weighted_loading_value || 0), 0)); document.querySelector('#updated').textContent = snapshot.generated_at ? new Date(snapshot.generated_at).toLocaleString() : '-';
        document.querySelector('#table-head').innerHTML = `<tr><th>Name</th><th>uIPS</th><th>uHSD</th><th>Jira</th><th>Stale IPS</th><th>Stale HSD</th><th>Total</th><th>Weighted Loading</th>${categories.map(category => `<th>${esc(category)}</th>`).join('')}</tr>`;
        document.querySelector('#table-body').innerHTML = rows.map(row => `<tr><td>${esc(row.name)}</td><td>${row.uips ?? 0}</td><td>${row.uhsd ?? 0}</td><td>${row.jira ?? 0}</td><td>${row.stale_ips ?? 0}</td><td>${row.stale_hsd ?? 0}</td><td>${row.total ?? 0}</td><td class="weighted">${esc(row.weighted_loading || '')}</td>${categories.map(category => `<td>${row.category_counts?.[category] ?? 0}</td>`).join('')}</tr>`).join('');
        empty.hidden = rows.length > 0; empty.textContent = snapshot.message || 'No loading rows are available.'; status.textContent = snapshot.available ? 'Latest snapshot' : 'Waiting for batch result';
      } catch (error) { status.textContent = 'Unavailable'; empty.hidden = false; empty.textContent = `Unable to load team loading: ${error.message}`; }
    }
    const runButton = document.querySelector('#run-batch');
    const runStatus = document.querySelector('#run-status');
    async function readBatchStatus() {
      const response = await fetch('/api/batch', { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function runBatch() {
      runButton.disabled = true; runStatus.textContent = 'Starting batch...';
      try {
        const response = await fetch('/api/run-batch', { method: 'POST' });
        const result = await response.json();
        if (!response.ok && response.status !== 409) throw new Error(result.message || `HTTP ${response.status}`);
        runStatus.textContent = 'Batch running...';
        const poll = async () => {
          const state = await readBatchStatus();
          if (state.running) { runStatus.textContent = 'Batch running...'; window.setTimeout(poll, 2000); return; }
          runButton.disabled = false;
          if (state.return_code === 0) { runStatus.textContent = 'Batch complete'; await loadSnapshot(); }
          else { runStatus.textContent = `Batch ended with code ${state.return_code ?? 'unknown'}`; }
        };
        await poll();
      } catch (error) { runButton.disabled = false; runStatus.textContent = `Unable to run batch: ${error.message}`; }
    }
    document.querySelector('#refresh').addEventListener('click', loadSnapshot);
    runButton.addEventListener('click', runBatch);
    loadSnapshot();
  </script>
</body>
</html>
